            class="mr-4 h-12 w-auto rounded-md"
          />
        </div>
        <div class="block sm:hidden">
          <button id="menu-toggle" class="text-primary focus:outline-none">
            <svg
              class="h-6 w-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16m-7 6h7"

        <ul id="menu" class="hidden space-x-6 sm:flex">
          <li>
            <a href="#" class="text-primary hover:text-opacity-80">O nas</a>
          </li>
          <li>

          <li>

          </li>
        </ul>
      </nav>
      <div id="mobile-menu" class="hidden">
        <ul class="flex flex-col space-y-2 bg-white p-4">
          <li>
            <a href="#" class="text-primary hover:text-opacity-80">O nas</a>
          </li>
          <li>
            <a href="#" class="text-primary hover:text-opacity-80">Ekologia</a>
          </li>
          <li>
            <a href="#" class="text-primary hover:text-opacity-80">Tłoczenia</a>
          </li>
        </ul>
      </div>
    </header>

    <main></main>

    <footer class="bg-primary py-8 text-white">
      <div class="container mx-auto flex flex-col justify-between px-4 sm:flex-row">
        <div class="mb-0 flex flex-1 flex-row items-start justify-between">
          <div class="mb-0 flex-1 items-center">
            <img
              src="/assets/icons/vertical_black.svg"
              alt="Makowski Sad Logo"
              class="mr-1 h-28 w-auto rounded-md"
            />
          </div>
          <div class="flex-1">
            <p>ul. Sosnowa 7</p>

            <p>info@makowskisad.pl</p>

        </div>
        <div class="mb-0 flex flex-row items-start">

            <h3 class="mb-2 text-left font-bold sm:text-center">Znajdź nas na socialach</h3>
            <div class="flex justify-start space-x-4">

              <a href="https://facebook.com/makowskisad" class="hover:opacity-80"
                ><img src="/assets/icons/facebook.svg" alt="Facebook" class="h-6 w-6 rounded-md"
              /></a>
            </div>
          </div>
